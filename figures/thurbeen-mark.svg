<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="thurbeen logo mark">
  <!-- home box: the org root every project hangs off -->
  <rect x="6" y="7" width="52" height="27" rx="8" fill="#1a080a"/>
  <rect x="7.25" y="8.25" width="49.5" height="24.5" rx="6.75" fill="none" stroke="#ff5c54" stroke-width="2.5"/>
  <text x="13" y="28" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#6eff6e">~/</text>
  <rect x="35" y="20.5" width="12" height="5.5" rx="1" fill="#6eff6e"/>
  <!-- distribution tree -->
  <g stroke="#ff5c54" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M32 34 V40"/>
    <path d="M14 40 H50"/>
    <path d="M14 40 V44"/>
    <path d="M32 40 V44"/>
    <path d="M50 40 V44"/>
  </g>
  <!-- project boxes (shipped / in flight / incubating) -->
  <rect x="9" y="45" width="10" height="10" rx="2.5" fill="#1a080a" stroke="#6eff6e" stroke-width="2.2"/>
  <rect x="27" y="45" width="10" height="10" rx="2.5" fill="#1a080a" stroke="#ffb627" stroke-width="2.2"/>
  <rect x="45" y="45" width="10" height="10" rx="2.5" fill="#1a080a" stroke="#ff5c54" stroke-width="2.2"/>
</svg>
